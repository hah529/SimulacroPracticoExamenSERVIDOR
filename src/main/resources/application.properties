spring.application.name=biblioteca
server.port=8080
api.path=/api
api.version=v1

### H2 EN FICHERO, en la carpeta data/ del proyecto.
### Con ddl-auto=create, cada arranque empieza de cero con los datos de data.sql
spring.datasource.url=jdbc:h2:file:./data/biblioteca;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

### Hibernate crea las tablas A PARTIR DE TUS ENTIDADES
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

### data.sql se ejecuta DESPUES de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

### Consola de H2: http://localhost:8080/h2-console  (URL jdbc:h2:file:./data/biblioteca, usuario sa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

### Mensajes de error legibles
spring.web.error.include-message=always
server.error.include-message=always
